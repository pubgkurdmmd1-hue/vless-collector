name: collect-and-test

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install xray-core
        run: |
          curl -sL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -q xray.zip xray
          chmod +x xray
          ./xray version

      - name: Run collector and tester
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python3 scripts/run.py

      - name: Commit stats (heartbeat + history)
        run: |
          git config user.name "vless-bot"
          git config user.email "vless-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "auto: test results $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
