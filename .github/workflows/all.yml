name: all

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "worker/**"
      - ".github/workflows/all.yml"

permissions:
  contents: write

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install xray-core
        run: |
          curl -sL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -q xray.zip xray
          chmod +x xray
          ./xray version

      - name: Run collector and tester
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python3 scripts/run.py

      - name: Commit stats (heartbeat + history)
        run: |
          git config user.name "vless-bot"
          git config user.email "vless-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "auto: test results $(date -u +%Y-%m-%dT%H:%MZ)" && git push)

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Check secrets
        env:
          SUB_SECRET: ${{ secrets.SUB_SECRET }}
        run: |
          if [ -z "$SUB_SECRET" ]; then echo "SUB_SECRET is missing. Add it in Settings, Secrets and variables, Actions."; exit 1; fi
          echo "secrets ok"

      - name: Deploy worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Set worker secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUB_SECRET: ${{ secrets.SUB_SECRET }}
        run: printf '%s' "$SUB_SECRET" | wrangler secret put SUB_SECRET
